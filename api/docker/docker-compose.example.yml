# Example local stack (SPEC §0 dev env): postgres, redis, minio, mailpit, api, nginx, horizon, scheduler.
# Copy to the repository root as docker-compose.yml and adjust.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: sciis, POSTGRES_USER: sciis, POSTGRES_PASSWORD: secret }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    build: { context: ../, dockerfile: Dockerfile }
    env_file: ../.env
    depends_on: [postgres, redis, minio]
    volumes: [../:/var/www/api]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../:/var/www/api:ro
    depends_on: [api]

  horizon:
    build: { context: ../, dockerfile: Dockerfile }
    command: php artisan horizon
    env_file: ../.env
    depends_on: [postgres, redis]
    volumes: [../:/var/www/api]

  scheduler:
    build: { context: ../, dockerfile: Dockerfile }
    command: php artisan schedule:work
    env_file: ../.env
    depends_on: [postgres, redis]
    volumes: [../:/var/www/api]

volumes:
  pgdata:
  minio:
