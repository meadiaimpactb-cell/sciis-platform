# SCIIS API — nginx in front of php-fpm (container `api:9000`).
server {
    listen 80;
    server_name _;
    root /var/www/api/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # Security headers at the edge (SEC-02); the app adds CSP/HSTS too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Health for load balancers.
    location = /up { try_files $uri /index.php?$query_string; access_log off; }
    location = /api/v1/health { try_files $uri /index.php?$query_string; access_log off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|log|ini|sh)$ { deny all; }

    error_page 404 /index.php;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
