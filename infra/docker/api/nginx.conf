# nginx in front of php-fpm inside the api image (port 8080)
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 30m;       # documents.max_size_mb=25 + multipart overhead (DOC-01)
    client_body_timeout 60s;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain application/xml;

    # Real client IP when behind the edge load balancer / WAF
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Security headers (SEC-02); CSP is set by the Laravel middleware
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz { access_log off; return 200 'ok'; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_read_timeout 120s;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known) { deny all; }
        location ~* \.(env|log|sql|bak)$ { deny all; }
    }
}
