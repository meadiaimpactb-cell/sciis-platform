      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/opportunities:
    get:
      tags: [Admin]
      operationId: adminListOpportunities
      summary: كل الفرص مع عوامل تصفية إدارية
      x-requirement: [ADM-02, ACC-04]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: filter[status]
          in: query
          schema: { $ref: '#/components/schemas/OpportunityStatus' }
        - $ref: '#/components/parameters/FilterSector'
        - name: filter[overdue]
          in: query
          schema: { type: boolean }
        - name: filter[assignee]
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Opportunities (evaluators see only assigned ones — ACC-04)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OpportunityAdminRow' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/opportunities/{uuid}:
    get:
      tags: [Admin]
      operationId: adminGetOpportunity
      summary: الملف الكامل + الخط الزمني + الملاحظات الداخلية
      x-requirement: [ADM-02, ADM-05, AUD-03]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Full admin view
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OpportunityFull' }
                  timeline:
                    type: array
                    items: { $ref: '#/components/schemas/StatusTransition' }
                  notes:
                    type: array
                    items: { $ref: '#/components/schemas/InternalNote' }
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  completion_requests:
                    type: array
                    items: { $ref: '#/components/schemas/CompletionRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/opportunities/{uuid}/assign:
    post:
      tags: [Admin]
      operationId: adminAssignReviewer
      summary: إسناد مراجع
      x-requirement: [ADM-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewer_user_id]
              properties:
                reviewer_user_id: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/opportunities/{uuid}/transition:
    post:
      tags: [Admin]
      operationId: adminTransitionOpportunity
      summary: نقل الحالة عبر آلة الحالات (OpportunityStateMachine)
      x-requirement: [ADM-01, AUD-01, NTF-01]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/OpportunityStatus' }
                reason: { type: string, maxLength: 2000, description: 'Required for `not_eligible` and `closed`' }
      responses:
        '200':
          description: Transitioned; row written to `opportunity_status_transitions` and `audit_logs`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusTransition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Transition not allowed from current status / preconditions unmet
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      code: { type: string, example: invalid_transition }
                      from: { $ref: '#/components/schemas/OpportunityStatus' }
                      allowed:
                        type: array
                        items: { $ref: '#/components/schemas/OpportunityStatus' }
        '422': { $ref: '#/components/responses/ValidationError' }

