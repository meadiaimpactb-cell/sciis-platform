openapi: 3.1.0
info:
  title: SCIIS Platform API
  version: 1.0.0
  summary: منصة المجلس السعودي للمستثمرين الاجتماعيين — REST API v1
  description: |
    The single JSON contract consumed by the Nuxt web app **and** the Flutter mobile app
    (SPEC §6). Derived from "الوثيقة التطويرية 2.0"; every operation carries an
    `x-requirement` list with the requirement codes it implements.

    العقد الموحّد الذي يستهلكه الموقع وتطبيق الجوال معًا. كل عملية تحمل `x-requirement`
    بأكواد المتطلبات التي تنفّذها.

    ## Conventions / الاصطلاحات
    * Base path `/api/v1`; JSON only; `snake_case` keys.
    * `Accept-Language: ar|en` selects taxonomy labels and message language (default `ar`).
    * Pagination: `?page=&per_page=` (max 100) → `{data, links, meta}`.
    * Filtering on list endpoints: `?filter[sector]=&filter[region]=&filter[stage]=&filter[type]=&sort=newest|impact|need&search=`.
    * Errors are RFC-7807-ish `{message, errors{field:[...]}, code}`.
    * `X-Request-Id` is echoed back on every response and written to `audit_logs`.
    * All mutating requests are audited (AUD-01).

    ## Authentication / المصادقة
    * **Web (SPA)**: Laravel Sanctum cookie session (`sanctum` scheme). Requires `GET /sanctum/csrf-cookie`
      first and `X-XSRF-TOKEN` on mutations.
    * **Mobile**: Sanctum personal access token returned by `POST /auth/login` with `device_name`,
      sent as `Authorization: Bearer <token>` (`bearerAuth` scheme).
    * Staff accounts must complete TOTP 2FA (ACC-05) — a `423` with `code=two_factor_required`
      is returned until `POST /auth/2fa/challenge` succeeds.

    ## Rate limiting / تحديد المعدل
    | Group | Limit |
    |---|---|
    | `/auth/login`, `/auth/forgot-password`, `/auth/resend-otp` | 5 / minute / IP + email |
    | `/auth/verify-*`, `/auth/2fa/challenge` | 10 / minute / user |
    | `/public/contact` | 3 / 10 minutes / IP (+ honeypot) |
    | `/public/*` | 60 / minute / IP |
    | authenticated routes | 120 / minute / user |
    | `/admin/reports/*/export.xlsx` | 10 / hour / user |
    | `/webhooks/moyasar` | not rate-limited; signature-verified |

    Exceeding a limit returns `429` with `Retry-After`.
  contact:
    name: SCIIS Engineering
    email: engineering@sciis.sa
  license:
    name: Proprietary — ملكية المجلس/وادي الأثر — تُحدد لاحقًا
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:8000/api/v1
    description: Local (docker compose)
  - url: https://api-test.sciis.sa/api/v1
    description: Test (KSA)
  - url: https://api.sciis.sa/api/v1
    description: Production (KSA)

security:
  - bearerAuth: []
  - sanctum: []

tags:
  - name: Auth
    description: التسجيل والدخول والتحقق (ACC-01..05)
  - name: Me
    description: الحساب الحالي، أجهزة الدفع، التفضيلات، طلبات البيانات
  - name: Taxonomies
    description: التصنيفات القابلة للتحرير بدون كود (FRM-04)
  - name: Settings
    description: الإعدادات العامة
  - name: Investor
    description: مسار المستثمر (INV / OPP / MAT)
  - name: Opportunities
    description: الفرص كما يراها المستثمر وفق مستوى الوصول (§5)
  - name: Documents
    description: الروابط الموقّعة المؤقتة (DOC-02)
  - name: Entrepreneur
    description: مسار صاحب المشروع (ENT)
  - name: Admin
    description: فريق المجلس (ADM / EVL / MAT / MTG / RPT / AUD)
  - name: Public
    description: الموقع العام (CMS)
  - name: Payments
    description: خلف FEATURE_PAYMENTS — رسوم العضوية والخدمات فقط
  - name: System
    description: الصحة والإصدار

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      operationId: authRegister
      summary: إنشاء حساب جديد وإرسال رموز التحقق
      security: []
      x-requirement: [ACC-01, ACC-02, PRV-01, PRV-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created; email + SMS OTPs sent. Mobile clients also receive a token.
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: authVerifyEmail
      summary: تأكيد البريد الإلكتروني برمز OTP
      x-requirement: [ACC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-phone:
    post:
      tags: [Auth]
      operationId: authVerifyPhone
      summary: تأكيد رقم الجوال برمز OTP
      x-requirement: [ACC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/resend-otp:
    post:
      tags: [Auth]
      operationId: authResendOtp
      summary: إعادة إرسال رمز التحقق
      x-requirement: [ACC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [email, sms] }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: تسجيل الدخول (جلسة كوكي للويب، رمز Bearer للجوال)
      security: []
      x-requirement: [ACC-01, ACC-05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated. `token` is present only when `device_name` was sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '423':
          description: Password accepted, TOTP challenge required (staff / 2FA-enabled accounts).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      code: { type: string, const: two_factor_required }
                      token:
                        type: string
                        description: Short-lived pre-auth token (mobile only) to use on `/auth/2fa/challenge`.
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa/challenge:
    post:
      tags: [Auth]
      operationId: authTwoFactorChallenge
      summary: التحقق من رمز TOTP بعد كلمة المرور
      x-requirement: [ACC-05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpCodeRequest' }
      responses:
        '200':
          description: Fully authenticated; mobile receives the final token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa/enable:
    post:
      tags: [Auth]
      operationId: authTwoFactorEnable
      summary: توليد سر TOTP ورمز QR
      x-requirement: [ACC-05]
      responses:
        '200':
          description: Secret generated (not yet confirmed).
          content:
            application/json:
              schema:
                type: object
                required: [secret, qr_svg, otpauth_url]
                properties:
                  secret: { type: string }
                  qr_svg: { type: string, description: Inline SVG }
                  otpauth_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/2fa/confirm:
    post:
      tags: [Auth]
      operationId: authTwoFactorConfirm
      summary: تأكيد تفعيل TOTP برمز صحيح
      x-requirement: [ACC-05]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpCodeRequest' }
      responses:
        '200':
          description: 2FA confirmed; recovery codes returned once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/2fa:
    delete:
      tags: [Auth]
      operationId: authTwoFactorDisable
      summary: تعطيل TOTP (غير مسموح لحسابات staff)
      x-requirement: [ACC-05]
      responses:
        '204': { description: Disabled }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: إنهاء الجلسة / إبطال الرمز الحالي
      x-requirement: [ACC-01]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: authForgotPassword
      summary: طلب رابط إعادة تعيين كلمة المرور
      security: []
      x-requirement: [ACC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Always 200 (no account enumeration).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: authResetPassword
      summary: إعادة تعيين كلمة المرور بالرمز المرسل
      security: []
      x-requirement: [ACC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── Me ─────────────────────────────
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: المستخدم الحالي + النوع + الأدوار + حالة العضوية + الاكتمال
      x-requirement: [ACC-01, ACC-03, INV-01]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: تحديث الاسم واللغة ووسيلة التواصل المفضلة
      x-requirement: [ACC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                locale: { $ref: '#/components/schemas/Locale' }
                preferred_contact: { type: string, enum: [email, phone, whatsapp] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/device-tokens:
    post:
      tags: [Me]
      operationId: registerDeviceToken
      summary: تسجيل رمز جهاز للإشعارات (idempotent)
      x-requirement: [NTF-01, NTF-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [ios, android, web] }
                token: { type: string, maxLength: 4096 }
      responses:
        '201': { description: Registered or refreshed (`last_seen_at`) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/device-tokens/{token}:
    delete:
      tags: [Me]
      operationId: deleteDeviceToken
      summary: إزالة رمز جهاز (عند الخروج)
      x-requirement: [NTF-01]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/notifications:
    get:
      tags: [Me]
      operationId: listMyNotifications
      summary: إشعارات داخل المنصة (database channel)
      x-requirement: [NTF-01]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/notifications/{id}/read:
    post:
      tags: [Me]
      operationId: markNotificationRead
      summary: تعليم إشعار كمقروء
      x-requirement: [NTF-01]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Marked read }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/notification-preferences:
    get:
      tags: [Me]
      operationId: getNotificationPreferences
      summary: تفضيلات الإشعارات حسب القناة والفئة
      x-requirement: [NTF-02]
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationPreference' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      tags: [Me]
      operationId: putNotificationPreferences
      summary: استبدال التفضيلات
      x-requirement: [NTF-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  items: { $ref: '#/components/schemas/NotificationPreference' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationPreference' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/data-requests:
    post:
      tags: [Me]
      operationId: createDataRequest
      summary: طلب حقوق صاحب البيانات (اطلاع/تصحيح/حذف) — PDPL
      x-requirement: [PRV-01, PRV-03]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [access, rectify, erase] }
                note: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Request logged; handled by super_admin within the PDPL deadline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference_no: { type: string, example: DR-2026-0042 }
                  due_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── Taxonomies & settings ─────────────────────────────
  /taxonomies:
    get:
      tags: [Taxonomies]
      operationId: listTaxonomies
      summary: كل المجموعات النشطة
      security: []
      x-requirement: [FRM-04]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Map of group → terms (labels localised by Accept-Language)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: '#/components/schemas/TaxonomyTerm' }
                    example:
                      sectors: [{ key: education, label: التعليم }]
                      regions: [{ key: riyadh, label: الرياض }]
        '429': { $ref: '#/components/responses/RateLimited' }
  /taxonomies/{group}:
    get:
      tags: [Taxonomies]
      operationId: getTaxonomyGroup
      summary: مجموعة واحدة
      security: []
      x-requirement: [FRM-04]
      parameters:
        - $ref: '#/components/parameters/TaxonomyGroup'
      responses:
        '200':
          description: Terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TaxonomyTerm' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /settings/public:
    get:
      tags: [Settings]
      operationId: getPublicSettings
      summary: الإعدادات العامة غير الحساسة
      security: []
      x-requirement: [ADM-03, CMS-01]
      responses:
        '200':
          description: Public settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSettings' }
        '429': { $ref: '#/components/responses/RateLimited' }
  # ───────────────────────────── Investor ─────────────────────────────
  /investor/profile:
    get:
      tags: [Investor]
      operationId: getInvestorProfile
      summary: الملف الاستثماري بأقسامه + نسبة الاكتمال
      x-requirement: [INV-01, ACC-03]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestorProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Investor]
      operationId: putInvestorProfile
      summary: حفظ قسم أو أكثر من الملف الاستثماري
      x-requirement: [INV-01, ACC-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestorProfileInput' }
      responses:
        '200':
          description: Saved; returns the profile with recomputed `completion_percent`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestorProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /investor/membership:
    get:
      tags: [Investor]
      operationId: getMembership
      summary: حالة العضوية
      x-requirement: [ACC-03, ACC-06]
      responses:
        '200':
          description: Membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /investor/membership/submit:
    post:
      tags: [Investor]
      operationId: submitMembership
      summary: تقديم طلب العضوية للمراجعة (registered → under_review)
      x-requirement: [ACC-03, ACC-06]
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Profile incomplete or already submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /investor/dashboard:
    get:
      tags: [Investor]
      operationId: getInvestorDashboard
      summary: لوحة المستثمر — عدادات، مقترحات، تحديثات، الاجتماع القادم
      x-requirement: [INV-01, OPP-06, MAT-01]
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestorDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /investor/saved:
    get:
      tags: [Investor]
      operationId: listSavedOpportunities
      summary: الفرص المحفوظة
      x-requirement: [OPP-04]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': { $ref: '#/components/responses/OpportunityCardPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /investor/interests:
    get:
      tags: [Investor]
      operationId: listInterests
      summary: اهتماماتي
      x-requirement: [INV-02, OPP-06]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Interests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Interest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /investor/interests/{id}:
    get:
      tags: [Investor]
      operationId: getInterest
      summary: تفاصيل اهتمام
      x-requirement: [INV-02]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Interest
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Interest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /investor/interests/{id}/close:
    post:
      tags: [Investor]
      operationId: closeInterest
      summary: إغلاق الاهتمام مع سبب من التصنيف
      x-requirement: [INV-02, MSG-02]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_id]
              properties:
                reason_id: { type: string, description: 'taxonomy key from group decline_reasons' }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Interest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /investor/info-requests:
    get:
      tags: [Investor]
      operationId: listMyInfoRequests
      summary: طلبات المعلومات التي أرسلتها
      x-requirement: [OPP-05, MSG-01]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Info requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/InfoRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /investor/nominations:
    get:
      tags: [Investor]
      operationId: listNominations
      summary: الترشيحات المرسلة إليّ مع سبب الترشيح والمعايير المطابقة
      x-requirement: [MAT-01, MAT-02, MAT-03]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Nominations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Nomination' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /investor/nominations/{id}/respond:
    post:
      tags: [Investor]
      operationId: respondNomination
      summary: الرد على ترشيح (مهتم / غير مهتم)
      x-requirement: [MAT-01, MAT-03]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, enum: [interested, declined] }
                decline_reason_id: { type: string }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Responded. `interested` auto-creates an Interest (status `sent`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Nomination' }
                  interest: { $ref: '#/components/schemas/Interest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /investor/meetings:
    get:
      tags: [Investor]
      operationId: listInvestorMeetings
      summary: اجتماعاتي
      x-requirement: [MTG-01, MTG-02]
      responses:
        '200':
          description: Meetings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Meeting' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ───────────────────────────── Opportunities (investor view) ─────────────────────────────
  /opportunities:
    get:
      tags: [Opportunities]
      operationId: listOpportunities
      summary: بطاقات الفرص (للأعضاء المعتمدين فقط، وفق سياسة الوصول)
      description: |
        Returns `OpportunityCard` resources only. Visible set is governed by
        `settings.opportunity.access_policy` (`nomination_only` → only nominated opportunities;
        `browse_all` → all `eligible` with approved teaser; `both`). Statuses
        `draft,new,under_review,needs_completion,not_eligible` are never returned.
      x-requirement: [OPP-01, OPP-03, MAT-05, MSG-01]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/FilterSector'
        - $ref: '#/components/parameters/FilterRegion'
        - $ref: '#/components/parameters/FilterStage'
        - $ref: '#/components/parameters/FilterType'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Search'
      responses:
        '200': { $ref: '#/components/responses/OpportunityCardPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Membership not approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /opportunities/{uuid}:
    get:
      tags: [Opportunities]
      operationId: getOpportunity
      summary: تفاصيل الفرصة وفق مستوى وصول المستدعي (تبويبات)
      description: |
        Shaped by `OpportunityDetailResource($accessLevel)` per SPEC §5. Confidential groups
        (`use_of_funds` detail, `risks.full`, `documents.items`, `funding_amount` exact) appear
        only at `granted`/`connected`; `owner_contact` only at `connected`.
      x-requirement: [OPP-02, INV-03, MSG-01, DOC-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OpportunityDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /opportunities/{uuid}/save:
    post:
      tags: [Opportunities]
      operationId: saveOpportunity
      summary: حفظ الفرصة
      x-requirement: [OPP-04]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '204': { description: Saved (idempotent) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Opportunities]
      operationId: unsaveOpportunity
      summary: إزالة من المحفوظة
      x-requirement: [OPP-04]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /opportunities/{uuid}/interest:
    post:
      tags: [Opportunities]
      operationId: expressInterest
      summary: إبداء الاهتمام (sent → awaiting_owner_approval)
      x-requirement: [INV-02, ENT-06, MSG-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Interest created; owner notified (identity withheld until connected).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Interest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: An open interest already exists for this opportunity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /opportunities/{uuid}/info-requests:
    post:
      tags: [Opportunities]
      operationId: createInfoRequest
      summary: طلب معلومات إضافية عبر المجلس (دون كشف هوية المستثمر)
      x-requirement: [OPP-05, MSG-01]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Created (status `sent`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InfoRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /opportunities/{uuid}/nda-accept:
    post:
      tags: [Opportunities]
      operationId: acceptNda
      summary: قبول اتفاقية عدم الإفصاح (شرط للملف الكامل)
      x-requirement: [ENT-06, DOC-02, PRV-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, description: NDA text version shown to the user }
      responses:
        '201':
          description: Consent row inserted (never updated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  consent_id: { type: integer }
                  accepted_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /opportunities/{uuid}/documents:
    get:
      tags: [Opportunities]
      operationId: listOpportunityDocuments
      summary: مستندات الفرصة (للممنوحين فقط)
      x-requirement: [INV-03, DOC-02, ENT-06]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Documents (no download links; use `/documents/{uuid}/download-url`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: No active file_access_grant or NDA not accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /documents/{uuid}/download-url:
    get:
      tags: [Documents]
      operationId: getDocumentDownloadUrl
      summary: رابط موقّع مؤقت + تسجيل الوصول
      x-requirement: [DOC-02, INV-04, AUD-01]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Signed URL (≤ 10 minutes). A `document_access_logs` row is written.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423':
          description: Document scan pending or infected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────────── Entrepreneur ─────────────────────────────
  /entrepreneur/dashboard:
    get:
      tags: [Entrepreneur]
      operationId: getEntrepreneurDashboard
      summary: لوحة صاحب المشروع — الفرص، المطلوب الآن، طلبات الوصول، الاكتمال
      x-requirement: [ENT-01, ENT-04, ENT-06, ADM-04]
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntrepreneurDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /entrepreneur/opportunities:
    get:
      tags: [Entrepreneur]
      operationId: listOwnedOpportunities
      summary: فرصي
      x-requirement: [ENT-01]
      responses:
        '200':
          description: Owned opportunities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OwnedOpportunity' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Entrepreneur]
      operationId: createOpportunityDraft
      summary: إنشاء مسودة فرصة
      x-requirement: [ENT-01, ENT-02]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 160 }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OpportunityFull' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /entrepreneur/opportunities/{uuid}:
    get:
      tags: [Entrepreneur]
      operationId: getOwnedOpportunity
      summary: الملف الكامل لفرصتي
      x-requirement: [ENT-01, ENT-05]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Full file (owner view)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OpportunityFull' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Entrepreneur]
      operationId: updateOwnedOpportunity
      summary: تحديث قسم (basics / organization / impact / financials / disclosures)
      description: Sections are locked per status (ENT-05); a locked section returns `409`.
      x-requirement: [ENT-02, ENT-05]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OpportunityFull' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Section locked for the current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /entrepreneur/opportunities/{uuid}/checklist:
    get:
      tags: [Entrepreneur]
      operationId: getOpportunityChecklist
      summary: الحقول والمستندات الناقصة قبل التقديم
      x-requirement: [ENT-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Checklist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checklist' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /entrepreneur/opportunities/{uuid}/submit:
    post:
      tags: [Entrepreneur]
      operationId: submitOpportunity
      summary: تقديم الفرصة (draft → new) وتوليد الرقم المرجعي
      x-requirement: [ENT-03, ADM-01, PRV-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_accuracy_declared]
              properties:
                data_accuracy_declared: { type: boolean, const: true }
      responses:
        '200':
          description: Submitted; `reference_no` assigned; confirmation email sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference_no: { type: string, example: A-2026-0007 }
                  status: { $ref: '#/components/schemas/OpportunityStatus' }
                  review_due_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Checklist incomplete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      checklist: { $ref: '#/components/schemas/Checklist' }

  /entrepreneur/opportunities/{uuid}/withdraw:
    post:
      tags: [Entrepreneur]
      operationId: withdrawOpportunity
      summary: سحب الفرصة (قبل الربط)
      x-requirement: [ENT-07, ADM-01]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Not withdrawable in current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /entrepreneur/opportunities/{uuid}/indicators:
    get:
      tags: [Entrepreneur]
      operationId: listOwnedIndicators
      summary: مؤشرات الأثر
      x-requirement: [ENT-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Indicators
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ImpactIndicator' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Entrepreneur]
      operationId: createIndicator
      summary: إضافة مؤشر أثر
      x-requirement: [ENT-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImpactIndicatorInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImpactIndicator' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /entrepreneur/opportunities/{uuid}/indicators/{id}:
    delete:
      tags: [Entrepreneur]
      operationId: deleteIndicator
      summary: حذف مؤشر (قبل التقديم فقط)
      x-requirement: [ENT-02, ENT-05]
      parameters:
        - $ref: '#/components/parameters/Uuid'
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /entrepreneur/opportunities/{uuid}/documents:
    post:
      tags: [Entrepreneur]
      operationId: uploadOpportunityDocument
      summary: رفع مستند (multipart) → pending_review + فحص فيروسات في الطابور
      x-requirement: [DOC-01, DOC-03, ENT-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { $ref: '#/components/schemas/DocumentKind' }
                title: { type: string, maxLength: 160 }
                file:
                  type: string
                  format: binary
                  description: Max `documents.max_size_mb`; mimes per `documents.allowed_mimes`.
                supersedes_document_id: { type: string, format: uuid }
      responses:
        '201':
          description: Stored; `scan_result=pending` until the ClamAV job finishes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { description: File too large }
        '415': { description: Mime not allowed }
        '422': { $ref: '#/components/responses/ValidationError' }

  /entrepreneur/opportunities/{uuid}/preview:
    get:
      tags: [Entrepreneur]
      operationId: previewOpportunity
      summary: المعاينة كما سيراها المستثمر (بطاقة + تفاصيل)
      x-requirement: [ENT-09, MAT-05]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      responses:
        '200':
          description: Preview at `approved_member` level
          content:
            application/json:
              schema:
                type: object
                properties:
                  card: { $ref: '#/components/schemas/OpportunityCard' }
                  detail: { $ref: '#/components/schemas/OpportunityDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /entrepreneur/opportunities/{uuid}/teaser/approve:
    post:
      tags: [Entrepreneur]
      operationId: ownerApproveTeaser
      summary: موافقة صاحب المشروع على الملخص التعريفي (نشر)
      x-requirement: [MAT-05, ENT-09, PRV-02]
      parameters: [{ $ref: '#/components/parameters/Uuid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teaser_version]
              properties:
                teaser_version: { type: integer }
      responses:
        '200':
          description: "`teasers.approved_by_owner_at` set; consent `teaser_publication` inserted."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Teaser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Teaser version changed since viewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /entrepreneur/access-requests:
    get:
      tags: [Entrepreneur]
      operationId: listAccessRequests
      summary: طلبات الاطلاع على الملف الكامل (هوية المستثمر محجوبة)
      x-requirement: [ENT-06, MSG-01]
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /entrepreneur/access-requests/{interestId}/decide:
    post:
      tags: [Entrepreneur]
      operationId: decideAccessRequest
      summary: الموافقة أو الرفض على مشاركة الملف الكامل (الموافقة المزدوجة)
      x-requirement: [ENT-06, MSG-02, PRV-02]
      parameters:
        - name: interestId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, decline] }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: |
            `approve` → `file_access_grants` row + consent `full_file_share`, interest → `shared`.
            `decline` → interest → `closed` with reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Interest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
