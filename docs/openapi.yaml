        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409':
          description: Not cancellable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /webhooks/moyasar:
    post:
      tags: [Payments]
      operationId: moyasarWebhook
      summary: Webhook من Moyasar (توقيع مُتحقق، idempotent)
      description: |
        Verified with the shared secret; idempotent on `gateway_payment_id`; every delivery is
        logged to `payment_events` with `signature_valid`; emits `PaymentPaid`.
      security: []
      x-requirement: [SEC-01, AUD-01]
      parameters:
        - name: X-Moyasar-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Moyasar event payload
              additionalProperties: true
      responses:
        '200': { description: Processed or already processed }
        '400': { description: 'Invalid signature (logged, not retried)' }

  # ───────────────────────────── System ─────────────────────────────
  /health:
    get:
      tags: [System]
      operationId: health
      summary: فحص الصحة لمراقبي التوافر
      security: []
      x-requirement: [BKP-03]
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /version:
    get:
      tags: [System]
      operationId: version
      summary: إصدار الـ API والتزام git
      security: []
      x-requirement: [SCL-03]
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema:
                type: object
                properties:
                  api: { type: string, example: v1 }
                  version: { type: string, example: 1.0.0 }
                  commit: { type: string }
                  built_at: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/RateLimited' }

# ═══════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: Mobile clients. Obtained from `POST /auth/login` with `device_name`.
    sanctum:
      type: apiKey
      in: cookie
      name: sciis_session
      description: |
        Web SPA cookie session (Laravel Sanctum stateful domains). Call `GET /sanctum/csrf-cookie`
        first and send `X-XSRF-TOKEN` on every mutating request.

  headers:
    X-Request-Id:
      description: Echo of the request id (generated server-side if absent); stored in audit_logs.
      schema: { type: string, format: uuid }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, enum: [ar, en], default: ar }
      description: Selects localised labels and messages.
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Uuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    FilterSector:
      name: filter[sector]
      in: query
      schema: { type: string }
      description: taxonomy key from `sectors`
    FilterRegion:
      name: filter[region]
      in: query
      schema: { type: string }
      description: taxonomy key from `regions`
    FilterStage:
      name: filter[stage]
      in: query
      schema: { $ref: '#/components/schemas/ProjectStage' }
    FilterType:
      name: filter[type]
      in: query
      schema: { $ref: '#/components/schemas/InvestmentType' }
    Sort:
      name: sort
      in: query
      schema: { type: string, enum: [newest, impact, need], default: newest }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    TaxonomyGroup:
      name: group
      in: path
      required: true
      schema:
        type: string
        enum: [sectors, regions, investment_types, beneficiary_groups, sdgs, project_stages, investment_ranges, decline_reasons, how_heard]
    ReportKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        enum:
          - registrations_by_type
          - memberships_by_status
          - opportunities_funnel
          - opportunities_by_sector_stage_region
          - first_time_completion_rate
          - avg_review_time
          - avg_evaluation_time
          - overdue_items
          - eligibility_rate
          - interest_rate
          - connection_rate
          - acquisition_channels
          - agreement_conversion
          - execution_status
          - impact_aggregates
          - meeting_attendance
    ContentType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [pages, faqs, news, events] }

  responses:
    OkMessage:
      description: OK
      headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    Unauthenticated:
      description: Missing or invalid token / session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Unauthenticated., code: unauthenticated }
    Forbidden:
      description: Authenticated but not allowed (role, record-level policy, or access level)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: هذا الإجراء غير مصرح به., code: forbidden }
    NotFound:
      description: Not found (also returned instead of 403 for resources the caller must not know exist)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: البيانات المدخلة غير صالحة.
            code: validation_failed
            errors: { email: ['البريد الإلكتروني مستخدم مسبقًا'] }
    RateLimited:
      description: Too many requests
      headers: { Retry-After: { $ref: '#/components/headers/Retry-After' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FeatureDisabled:
      description: Feature flag off (`features.payments=false`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Not found., code: feature_disabled }
    OpportunityCardPage:
      description: Paginated teaser cards
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OpportunityCard' }

  schemas:
    # ── Enums (SPEC §2) ──
    UserType:
      type: string
      enum: [investor_individual, investor_institutional, entrepreneur_individual, entrepreneur_entity, staff]
    StaffRole:
      type: string
      enum: [super_admin, membership_officer, reviewer, evaluator, matching_officer, agreements_officer, impact_officer, advisory_member, reports_viewer]
    AccessLevel:
      type: string
      enum: [visitor, registered, approved_member, granted, connected]
    Locale:
      type: string
      enum: [ar, en]
    OpportunityStatus:
      type: string
      enum: [draft, new, under_review, needs_completion, not_eligible, eligible, connected, negotiating, in_execution, operating, withdrawn, closed]
    MembershipStatus:
      type: string
      enum: [registered, under_review, needs_completion, approved, suspended, rejected]
    InterestStatus:
      type: string
      enum: [sent, awaiting_owner_approval, shared, connected, meeting, closed]
    InfoRequestStatus:
      type: string
      enum: [sent, processing, answered, closed]
    Sensitivity:
      type: string
      enum: [public, internal, confidential, sensitive_personal]
      description: ع / د / س / ح
    EvaluationAxis:
      type: string
      enum: [readiness, feasibility, impact]
    EvaluationResult:
      type: string
      enum: [eligible, eligible_with_conditions, not_eligible_now]
    AssignmentStatus:
      type: string
      enum: [assigned, coi_declared, scored, withdrawn]
    DocumentKind:
      type: string
      enum: [pitch_deck, commercial_register, license, financial_statements, business_plan, team_cv, impact_evidence, authorization_letter, financial_projections, agreement, progress_evidence, other]
    DocumentStatus:
      type: string
      enum: [pending_review, accepted, required, rejected]
    IndicatorValueStatus:
      type: string
      enum: [entered, verified, needs_clarification]
    ExecutionStatus:
      type: string
      enum: [on_track, delayed, stalled]
    MeetingStatus:
      type: string
      enum: [scheduled, held, cancelled]
    AgreementStatus:
      type: string
      enum: [draft, legal_review, approved, signed, archived]
    ConsentType:
      type: string
      enum: [privacy_policy, terms, teaser_publication, full_file_share, nda, data_accuracy]
    NotificationChannel:
      type: string
      enum: [database, mail, sms]
    PaymentStatus:
      type: string
      enum: [pending, authorized, paid, failed, refunded, cancelled]
    PaymentPurpose:
      type: string
      enum: [membership_fee, service_fee, training, sponsorship]
    InvestmentType:
      type: string
      enum: [equity, debt, pay_for_results, grant, guarantee, patient_capital, convertible, revenue_share, blended]
    ProjectStage:
      type: string
      enum: [idea, prototype, pre_seed, seed, early_stage, later_stage]
    RiskAppetite:
      type: string
      enum: [high, medium, low]
    RevenueState:
      type: string
      enum: [none, early, regular]
    LegalForm:
      type: string
      enum: [company, establishment, nonprofit, other]
    InstitutionType:
      type: string
      enum: [company, fund, family_office, donor, nonprofit, other]

    # ── Envelopes & errors ──
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Error:
      type: object
      required: [message]
      description: RFC-7807-ish error body
      properties:
        message: { type: string }
        code: { type: string, description: 'machine code, e.g. validation_failed, invalid_transition, two_factor_required' }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        request_id: { type: string, format: uuid }
    PaginatedEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: {} }
        links:
          type: object
          properties:
            first: { type: [string, 'null'], format: uri }
            last: { type: [string, 'null'], format: uri }
            prev: { type: [string, 'null'], format: uri }
            next: { type: [string, 'null'], format: uri }
        meta:
          type: object
          required: [current_page, last_page, per_page, total]
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }

    # ── Auth / me ──
    RegisterRequest:
      type: object
      required: [type, name, email, phone, password, locale, consents]
      properties:
        type:
          allOf: [{ $ref: '#/components/schemas/UserType' }]
          description: '`staff` cannot self-register.'
        name: { type: string, minLength: 3, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\+[1-9]\d{7,14}$', description: E.164 }
        password: { type: string, format: password, minLength: 8 }
        locale: { $ref: '#/components/schemas/Locale' }
        consents:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/ConsentType' }
          description: Must include `privacy_policy` and `terms`.
        organization_name: { type: string, description: Required for institutional / entity types }
        how_heard_id: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        device_name:
          type: string
          maxLength: 60
          description: When present a personal access token is issued (mobile); absent → cookie session (web).
    OtpCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    AuthResponse:
      type: object
      required: [user]
      properties:
        token: { type: string, description: Present for mobile (device_name) only }
        two_factor_required: { type: boolean, default: false }
        user: { $ref: '#/components/schemas/User' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/StaffRole' }
        membership: { $ref: '#/components/schemas/Membership' }
        access_level: { $ref: '#/components/schemas/AccessLevel' }
        completion_percent: { type: integer, minimum: 0, maximum: 100 }
    User:
      type: object
      required: [uuid, name, email, type, locale]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        type: { $ref: '#/components/schemas/UserType' }
        locale: { $ref: '#/components/schemas/Locale' }
        email_verified_at: { type: [string, 'null'], format: date-time }
        phone_verified_at: { type: [string, 'null'], format: date-time }
        two_factor_confirmed_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [active, suspended] }
        organization: { $ref: '#/components/schemas/OrganizationSummary' }
        last_login_at: { type: [string, 'null'], format: date-time }
    Me:
      type: object
      required: [user, roles, permissions, access_level, completion_percent]
      properties:
        user: { $ref: '#/components/schemas/User' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/StaffRole' }
        permissions:
          type: array
          items: { type: string, example: opportunities.view }
        membership: { $ref: '#/components/schemas/Membership' }
        access_level: { $ref: '#/components/schemas/AccessLevel' }
        completion_percent: { type: integer, minimum: 0, maximum: 100 }
        unread_notifications: { type: integer }
    OrganizationSummary:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        legal_form: { $ref: '#/components/schemas/LegalForm' }
        institution_type: { $ref: '#/components/schemas/InstitutionType' }
        region: { $ref: '#/components/schemas/TaxonomyTerm' }
        city: { type: string }
        founded_on: { type: [string, 'null'], format: date }
        website: { type: [string, 'null'], format: uri }
    UserAdmin:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            id: { type: integer }
            roles:
              type: array
              items: { $ref: '#/components/schemas/StaffRole' }
            created_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, data, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: OpportunityStatusChanged }
        data:
          type: object
          properties:
            title: { type: string }
            body: { type: string }
            route: { type: string, example: /opportunities/3f1c… }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    NotificationPreference:
      type: object
      required: [category, channel, enabled]
      properties:
        category:
          type: string
          enum: [status_changes, nominations, interests, info_requests, meetings, membership, reminders, system]
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        enabled: { type: boolean }

    # ── Taxonomies & settings ──
    TaxonomyTerm:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string, description: Localised by Accept-Language }
        group: { type: string }
        sort: { type: integer }
    TaxonomyTermAdmin:
      type: object
      required: [key, label_ar, label_en, is_active, sort]
      properties:
        id: { type: integer }
        group: { type: string }
        key: { type: string }
        label_ar: { type: string }
        label_en: { type: string }
        sort: { type: integer }
        is_active: { type: boolean }
        meta: { type: object, additionalProperties: true }
    TaxonomyTermInput:
      type: object
      required: [label_ar]
      properties:
        key: { type: string, pattern: '^[a-z0-9_]+$' }
        label_ar: { type: string }
        label_en: { type: string }
        sort: { type: integer }
        is_active: { type: boolean }
        meta: { type: object, additionalProperties: true }
    Setting:
      type: object
      required: [key, value, group]
      properties:
        key: { type: string, example: sla.review_days }
        value: {}
        group: { type: string, example: sla }
        description: { type: string }
        updated_by: { type: [integer, 'null'] }
        updated_at: { type: string, format: date-time }
    PublicSettings:
      type: object
      properties:
        platform:
          type: object
          properties:
            name_ar: { type: string }
            name_en: { type: string }
            short_name: { type: string }
            official_email: { type: string, format: email }
            official_phone: { type: string }
            whatsapp: { type: [string, 'null'] }
        opportunity:
          type: object
          properties:
            access_policy: { type: string, enum: [nomination_only, browse_all, both] }
            funding_display: { type: string, enum: [band, exact, hidden] }
        features:
          type: object
          properties:
            payments: { type: boolean }
            english: { type: boolean }
            browse_all: { type: boolean }
            watermark: { type: boolean }
            dark_mode: { type: boolean }
        supported_locales:
          type: array
          items: { $ref: '#/components/schemas/Locale' }
        legal_versions:
          type: object
          properties:
            privacy_policy: { type: string }
            terms: { type: string }
            nda: { type: string }
        documents:
          type: object
          properties:
            max_size_mb: { type: integer }
            allowed_mimes:
              type: array
              items: { type: string }

    # ── Investor ──
    InvestorProfile:
      type: object
      required: [completion_percent, sections]
      properties:
        completion_percent: { type: integer, minimum: 0, maximum: 100 }
        missing:
          type: array
          items: { type: string }
        sections:
          type: object
          properties:
            basics:
              type: object
              properties:
                country: { type: string }
                city: { type: string }
                employer: { type: string }
                job_title: { type: string }
                linkedin_url: { type: [string, 'null'], format: uri }
                preferred_contact: { type: string }
                how_heard: { $ref: '#/components/schemas/TaxonomyTerm' }
            interests:
              type: object
              properties:
                sectors: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
                stages: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
                investment_types: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
                regions: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
                causes: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
                risk_appetite: { $ref: '#/components/schemas/RiskAppetite' }
                investment_range: { $ref: '#/components/schemas/TaxonomyTerm' }
                mentoring_available: { type: boolean }
                mentoring_areas: { type: string }
            experience:
              type: object
              properties:
                experience_years: { type: integer }
                experience_desc: { type: string }
                prior_investments_count: { type: integer }
                prior_investments_desc: { type: string }
                has_social_investments: { type: boolean }
                social_investments_desc: { type: string }
                cv_document: { $ref: '#/components/schemas/Document' }
            declarations:
              type: object
              properties:
                conflicts_disclosure: { type: string }
                commit_meetings: { type: boolean }
                accredited_declaration:
                  type: object
                  description: Kept but not shown (status pending_legal — doc §7.5)
                  additionalProperties: true
    InvestorProfileInput:
      type: object
      description: Any subset of the sections above, with taxonomy keys instead of term objects.
      properties:
        basics: { type: object, additionalProperties: true }
        interests:
          type: object
          properties:
            sectors: { type: array, items: { type: string } }
            stages: { type: array, items: { $ref: '#/components/schemas/ProjectStage' } }
            investment_types: { type: array, items: { $ref: '#/components/schemas/InvestmentType' } }
            regions: { type: array, items: { type: string } }
            causes: { type: array, items: { type: string } }
            risk_appetite: { $ref: '#/components/schemas/RiskAppetite' }
            investment_range_id: { type: string }
            annual_investment_band_id: { type: string }
            mentoring_available: { type: boolean }
            mentoring_areas: { type: string }
        experience: { type: object, additionalProperties: true }
        declarations: { type: object, additionalProperties: true }
    Membership:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/MembershipStatus' }
        submitted_at: { type: [string, 'null'], format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        terms_accepted_at: { type: [string, 'null'], format: date-time }
        suspended_reason: { type: [string, 'null'] }
        needs_completion_items:
          type: array
          items: { type: string }
    MembershipAdmin:
      allOf:
        - $ref: '#/components/schemas/Membership'
        - type: object
          properties:
            id: { type: integer }
            user: { $ref: '#/components/schemas/User' }
            reviewed_by: { type: [integer, 'null'] }
            reviewed_at: { type: [string, 'null'], format: date-time }
            approved_by: { type: [integer, 'null'] }
            decision_note: { type: [string, 'null'], description: Internal }
            prior_investments_count: { type: integer }
    InvestorDashboard:
      type: object
      required: [counters, completion_percent]
      properties:
        counters:
          type: object
          required: [saved, interests, info_requests, meetings]
          properties:
            saved: { type: integer }
            interests: { type: integer }
            info_requests: { type: integer }
            meetings: { type: integer }
        completion_percent: { type: integer }
        suggested:
          type: array
          description: Rule-based (match_score) — only when access_policy allows browsing
          items: { $ref: '#/components/schemas/OpportunityCard' }
        updates:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              at: { type: string, format: date-time }
              opportunity_uuid: { type: [string, 'null'], format: uuid }
        next_meeting:
          oneOf:
            - $ref: '#/components/schemas/Meeting'
            - type: 'null'
    Interest:
      type: object
      required: [id, status, opportunity, created_at]
      properties:
        id: { type: integer }
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        investor:
          allOf: [{ $ref: '#/components/schemas/User' }]
          description: Present for staff only; never for the owner before `connected` (MSG-01).
        nomination_id: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/InterestStatus' }
        owner_decision: { type: [string, 'null'], enum: [approved, declined, null] }
        owner_decided_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }
        closed_reason: { type: [string, 'null'] }
        closed_at: { type: [string, 'null'], format: date-time }
        next_meeting_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Nomination:
      type: object
      required: [id, opportunity, matched_criteria, match_score, rationale, sent_at]
      properties:
        id: { type: integer }
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        matched_criteria:
          type: array
          items: { type: string, enum: [sector, stage, region, type, range] }
        match_score: { type: integer, minimum: 0, maximum: 5, description: count of matched criteria (MAT-02) }
        rationale: { type: string }
        teaser_version: { type: integer }
        sent_at: { type: string, format: date-time }
        response: { type: [string, 'null'], enum: [interested, declined, null] }
        decline_reason: { $ref: '#/components/schemas/TaxonomyTerm' }
        decline_note: { type: [string, 'null'] }
        responded_at: { type: [string, 'null'], format: date-time }
    Candidate:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        match_score: { type: integer }
        matched_criteria:
          type: array
          items: { type: string }
        already_nominated: { type: boolean }
        coi_excluded: { type: boolean, const: false, description: COI candidates are not returned at all (MAT-04) }
    InfoRequest:
      type: object
      required: [id, opportunity, subject, body, status, created_at]
      properties:
        id: { type: integer }
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        investor:
          allOf: [{ $ref: '#/components/schemas/User' }]
          description: Staff view only — never forwarded to the owner (OPP-05, MSG-01).
        subject: { type: string }
        body: { type: string }
        status: { $ref: '#/components/schemas/InfoRequestStatus' }
        forwarded_to_owner_at: { type: [string, 'null'], format: date-time }
        owner_answer: { type: [string, 'null'] }
        answered_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Meeting:
      type: object
      required: [id, title, starts_at, status]
      properties:
        id: { type: integer }
        opportunity: { $ref: '#/components/schemas/OpportunityRef' }
        interest_id: { type: [integer, 'null'] }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        location: { type: [string, 'null'] }
        video_url: { type: [string, 'null'], format: uri }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        participants:
          type: array
          items:
            type: object
            properties:
              user_id: { type: integer }
              name: { type: string }
              role: { type: string, enum: [investor, owner, council] }
              attended: { type: [boolean, 'null'] }
        minutes: { type: [string, 'null'], description: Staff + participants after held }
        actions:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              owner_user_id: { type: [integer, 'null'] }
              due_at: { type: [string, 'null'], format: date-time }
              done_at: { type: [string, 'null'], format: date-time }
        ics_sent_at: { type: [string, 'null'], format: date-time }
    MeetingInput:
      type: object
      properties:
        opportunity_uuid: { type: string, format: uuid }
        interest_id: { type: integer }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        location: { type: string }
        video_url: { type: string, format: uri }
        participant_user_ids:
          type: array
          items: { type: integer }
        status: { $ref: '#/components/schemas/MeetingStatus' }

    # ── Opportunities ──
    OpportunityRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        reference_no: { type: string }
        name: { type: string }
        teaser_summary: { type: string }
    OpportunityCard:
      type: object
      description: Teaser — public-sensitivity fields only (SPEC §5 column "teaser/card").
      required: [uuid, name, teaser_summary, sector, stage, status]
      properties:
        uuid: { type: string, format: uuid }
        reference_no: { type: string, example: A-2026-0003 }
        name: { type: string }
        organization_name: { type: [string, 'null'] }
        teaser_summary: { type: string, maxLength: 280 }
        highlights:
          type: array
          items: { type: string }
        sector: { $ref: '#/components/schemas/TaxonomyTerm' }
        stage: { $ref: '#/components/schemas/ProjectStage' }
        status: { $ref: '#/components/schemas/OpportunityStatus' }
        regions: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
        investment_types: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
        beneficiary_groups: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
        founded_year: { type: [integer, 'null'] }
        beneficiaries_target: { type: [integer, 'null'] }
        funding_display:
          type: [string, 'null']
          description: Band / exact / null per `settings.opportunity.funding_display`
        is_saved: { type: boolean }
        published_at: { type: [string, 'null'], format: date-time }
    OpportunityDetail:
      allOf:
        - $ref: '#/components/schemas/OpportunityCard'
        - type: object
          description: Shaped by caller access level; confidential groups omitted/summarised below `granted`.
          required: [access_level, problem_statement, solution, expected_change, indicators, documents]
          properties:
            access_level: { $ref: '#/components/schemas/AccessLevel' }
            problem_statement: { type: string }
            solution: { type: string }
            expected_change: { type: string }
            beneficiaries_desc: { type: string }
            beneficiaries_current: { type: [integer, 'null'] }
            website: { type: [string, 'null'], format: uri }
            sdgs: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
            indicators:
              type: array
              description: Primary + disclosed only before grant; all after.
              items: { $ref: '#/components/schemas/ImpactIndicator' }
            revenue_state: { $ref: '#/components/schemas/RevenueState' }
            revenue_model_desc: { type: [string, 'null'] }
            funding_amount:
              type: [number, 'null']
              description: Exact SAR only at granted+ (confidential)
            use_of_funds:
              oneOf:
                - type: object
                  description: Before grant
                  properties:
                    summary: { type: string }
                - type: array
                  description: After grant
                  items:
                    type: object
                    properties:
                      item: { type: string }
                      percent: { type: number }
            risks:
              type: object
              properties:
                summary: { type: [string, 'null'] }
                full: { type: [string, 'null'], description: granted+ only }
            license_status: { type: [string, 'null'] }
            documents:
              type: object
              required: [locked]
              properties:
                locked: { type: boolean }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Document' }
            interest_status:
              oneOf:
                - $ref: '#/components/schemas/InterestStatus'
                - type: 'null'
            info_request_open: { type: boolean }
            nda_accepted: { type: boolean }
            owner_contact:
              type: [object, 'null']
              description: sensitive_personal — only when interest = connected
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
            updated_at: { type: string, format: date-time }
    OpportunityFull:
      allOf:
        - $ref: '#/components/schemas/OpportunityDetail'
        - type: object
          description: Owner / staff view — all fields including internal.
          properties:
            short_description: { type: string }
            social_links: { type: object, additionalProperties: { type: string } }
            revenue_model_type: { type: string }
            last_year_revenue_band: { $ref: '#/components/schemas/TaxonomyTerm' }
            prior_funding: { type: boolean }
            prior_funding_desc: { type: [string, 'null'] }
            legal_disputes: { type: boolean }
            legal_disputes_desc: { type: [string, 'null'] }
            license_required: { type: boolean }
            operational_risks: { type: [string, 'null'] }
            council_relationship: { type: boolean }
            council_relationship_desc: { type: [string, 'null'], description: internal }
            organization: { $ref: '#/components/schemas/OrganizationSummary' }
            is_listed: { type: boolean }
            data_accuracy_declared_at: { type: [string, 'null'], format: date-time }
            submitted_at: { type: [string, 'null'], format: date-time }
            assigned_reviewer: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string } } }
            review_due_at: { type: [string, 'null'], format: date-time }
            completion_due_at: { type: [string, 'null'], format: date-time }
            evaluation_due_at: { type: [string, 'null'], format: date-time }
            evaluation_result:
              oneOf:
                - $ref: '#/components/schemas/EvaluationResult'
                - type: 'null'
            execution_status:
              oneOf:
                - $ref: '#/components/schemas/ExecutionStatus'
                - type: 'null'
            teaser: { $ref: '#/components/schemas/Teaser' }
            agreement:
              type: [object, 'null']
              description: P2 — modelled now, stubbed behind feature flag
              properties:
                id: { type: integer }
                status: { $ref: '#/components/schemas/AgreementStatus' }
                council_is_party: { type: boolean }
            completion_percent: { type: integer }
            locked_sections:
              type: array
              items: { type: string, enum: [basics, organization, impact, financials, disclosures] }
    OpportunityInput:
      type: object
      description: Partial update keyed by section (ENT-05 locking applies).
      properties:
        basics:
          type: object
          properties:
            name: { type: string, maxLength: 160 }
            short_description: { type: string, maxLength: 280 }
            sector_id: { type: string }
            stage: { $ref: '#/components/schemas/ProjectStage' }
            regions: { type: array, items: { type: string } }
            investment_types: { type: array, items: { $ref: '#/components/schemas/InvestmentType' } }
            website: { type: string, format: uri }
            social_links: { type: object, additionalProperties: { type: string } }
        organization:
          type: object
          properties:
            name: { type: string }
            legal_form: { $ref: '#/components/schemas/LegalForm' }
            cr_number: { type: string }
            unified_number: { type: string }
            license_number: { type: string }
            founded_on: { type: string, format: date }
            employees_count: { type: integer }
            region_id: { type: string }
            city: { type: string }
        impact:
          type: object
          properties:
            problem_statement: { type: string }
            solution: { type: string }
            expected_change: { type: string }
            beneficiaries_desc: { type: string }
            beneficiaries_current: { type: integer }
            beneficiaries_target: { type: integer }
            beneficiary_groups: { type: array, items: { type: string } }
            sdgs: { type: array, items: { type: string } }
        financials:
          type: object
          properties:
            revenue_model_type: { type: string }
            revenue_model_desc: { type: string }
            revenue_state: { $ref: '#/components/schemas/RevenueState' }
            last_year_revenue_band_id: { type: string }
            funding_amount: { type: number, minimum: 0 }
            use_of_funds:
              type: array
              items:
                type: object
                required: [item, percent]
                properties:
                  item: { type: string }
                  percent: { type: number, minimum: 0, maximum: 100 }
            prior_funding: { type: boolean }
            prior_funding_desc: { type: string }
        disclosures:
          type: object
          properties:
            legal_disputes: { type: boolean }
            legal_disputes_desc: { type: string }
            license_required: { type: boolean }
            license_status: { type: string }
            operational_risks: { type: string }
            council_relationship: { type: boolean }
            council_relationship_desc: { type: string }
    OwnedOpportunity:
      type: object
      required: [uuid, name, status, completion_percent]
      properties:
        uuid: { type: string, format: uuid }
        reference_no: { type: [string, 'null'] }
        name: { type: string }
        status: { $ref: '#/components/schemas/OpportunityStatus' }
        completion_percent: { type: integer }
        submitted_at: { type: [string, 'null'], format: date-time }
        review_due_at: { type: [string, 'null'], format: date-time }
        completion_due_at: { type: [string, 'null'], format: date-time }
        is_overdue: { type: boolean }
        interests_count: { type: integer }
    OpportunityAdminRow:
      allOf:
        - $ref: '#/components/schemas/OwnedOpportunity'
        - type: object
          properties:
            owner: { type: object, properties: { id: { type: integer }, name: { type: string } } }
            sector: { $ref: '#/components/schemas/TaxonomyTerm' }
            assigned_reviewer: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string } } }
            evaluation_result:
              oneOf:
                - $ref: '#/components/schemas/EvaluationResult'
                - type: 'null'
            due_at: { type: [string, 'null'], format: date-time }
    EntrepreneurDashboard:
      type: object
      required: [opportunities, required_now, access_requests, completion]
      properties:
        opportunities:
          type: array
          items: { $ref: '#/components/schemas/OwnedOpportunity' }
        required_now:
          type: array
          items: { $ref: '#/components/schemas/RequiredNowItem' }
        access_requests:
          type: array
          items: { $ref: '#/components/schemas/AccessRequest' }
        completion: { type: integer }
    RequiredNowItem:
      type: object
      required: [opportunity_uuid, opportunity_name, label]
      properties:
        opportunity_uuid: { type: string, format: uuid }
        opportunity_name: { type: string }
        label: { type: string }
        field: { type: [string, 'null'] }
        document_kind:
          oneOf:
            - $ref: '#/components/schemas/DocumentKind'
            - type: 'null'
        note: { type: [string, 'null'] }
        due_at: { type: [string, 'null'], format: date-time }
    AccessRequest:
      type: object
      required: [interest_id, opportunity_uuid, opportunity_name, requested_at]
      properties:
        interest_id: { type: integer }
        opportunity_uuid: { type: string, format: uuid }
        opportunity_name: { type: string }
        investor_type:
          allOf: [{ $ref: '#/components/schemas/UserType' }]
          description: Only the type — identity withheld (MSG-01)
        requested_at: { type: string, format: date-time }
        due_at: { type: [string, 'null'], format: date-time, description: sla.owner_decision_days }
    Checklist:
      type: object
      required: [complete, missing_fields, missing_documents]
      properties:
        complete: { type: boolean }
        completion_percent: { type: integer }
        missing_fields:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              field: { type: string }
              label: { type: string }
        missing_documents:
          type: array
          items:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/DocumentKind' }
              label: { type: string }
              required: { type: boolean }
    CompletionItem:
      type: object
      properties:
        field: { type: string }
        document_kind: { $ref: '#/components/schemas/DocumentKind' }
        note: { type: string }
    CompletionRequest:
      type: object
      properties:
        id: { type: integer }
        requested_by: { type: integer }
        due_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/CompletionItem' }
        resolved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    StatusTransition:
      type: object
      required: [from_status, to_status, actor, created_at]
      properties:
        id: { type: integer }
        from_status: { $ref: '#/components/schemas/OpportunityStatus' }
        to_status: { $ref: '#/components/schemas/OpportunityStatus' }
        actor: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        reason: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    InternalNote:
      type: object
      properties:
        id: { type: integer }
        author: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        body: { type: string }
        created_at: { type: string, format: date-time }
    Teaser:
      type: object
      properties:
        summary_ar: { type: string }
        summary_en: { type: [string, 'null'] }
        highlights: { type: array, items: { type: string } }
        version: { type: integer }
        approved_by_owner_at: { type: [string, 'null'], format: date-time }
        approved_by_council_at: { type: [string, 'null'], format: date-time }
    ImpactIndicator:
      type: object
      required: [id, name, unit, is_primary, is_disclosed]
      properties:
        id: { type: integer }
        name: { type: string }
        definition: { type: [string, 'null'] }
        unit: { type: string }
        baseline: { type: [number, 'null'] }
        target: { type: [number, 'null'] }
        latest_value: { type: [number, 'null'] }
        latest_status:
          oneOf:
            - $ref: '#/components/schemas/IndicatorValueStatus'
            - type: 'null'
        data_source: { type: [string, 'null'] }
        frequency: { type: string, enum: [monthly, quarterly, semiannual, annual] }
        verification_method: { type: [string, 'null'] }
        iris_code: { type: [string, 'null'] }
        sdg: { $ref: '#/components/schemas/TaxonomyTerm' }
        is_primary: { type: boolean }
        is_disclosed: { type: boolean }
    ImpactIndicatorInput:
      type: object
      required: [name, unit, frequency]
      properties:
        name: { type: string }
        definition: { type: string }
        unit: { type: string }
        baseline: { type: number }
        target: { type: number }
        data_source: { type: string }
        frequency: { type: string, enum: [monthly, quarterly, semiannual, annual] }
        verification_method: { type: string }
        sdg_id: { type: string }
        is_primary: { type: boolean }
        is_disclosed: { type: boolean }
    Document:
      type: object
      required: [uuid, kind, title, sensitivity, status, version]
      properties:
        uuid: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        title: { type: string }
        mime: { type: string }
        size_bytes: { type: integer }
        sha256: { type: string }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        reviewer_note: { type: [string, 'null'] }
        version: { type: integer }
        supersedes_document_id: { type: [string, 'null'], format: uuid }
        scan_result: { type: string, enum: [clean, infected, pending] }
        created_at: { type: string, format: date-time }

    # ── Evaluation ──
    EvaluationCriterion:
      type: object
      required: [key, axis, label_ar, weight, version, is_active]
      properties:
        id: { type: integer }
        axis: { $ref: '#/components/schemas/EvaluationAxis' }
        key: { type: string }
        label_ar: { type: string }
        label_en: { type: [string, 'null'] }
        weight: { type: number }
        scale_descriptions:
          type: object
          description: '{ "1": "...", … "5": "..." }'
          additionalProperties: { type: string }
        version: { type: integer }
        is_active: { type: boolean }
    EvaluationCriterionInput:
      type: object
      properties:
        key: { type: string }
        axis: { $ref: '#/components/schemas/EvaluationAxis' }
        label_ar: { type: string }
        label_en: { type: string }
        weight: { type: number, minimum: 0 }
        scale_descriptions:
          type: object
          additionalProperties: { type: string }
        is_active: { type: boolean }
    EvaluationAssignment:
      type: object
      properties:
        id: { type: integer }
        opportunity_uuid: { type: string, format: uuid }
        evaluator: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        coi_declared_at: { type: [string, 'null'], format: date-time }
        coi_has_conflict: { type: [boolean, 'null'] }
    Evaluation:
      type: object
      properties:
        assignment_id: { type: integer }
        evaluator: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        criteria_version: { type: integer }
        scores:
          type: object
          additionalProperties:
            type: object
            properties:
              score: { type: integer, minimum: 1, maximum: 5 }
              note: { type: string }
        axis_totals:
          type: object
          additionalProperties: { type: number }
        overall: { type: number }
        recommendation: { $ref: '#/components/schemas/EvaluationResult' }
        comment: { type: [string, 'null'] }
        submitted_at: { type: [string, 'null'], format: date-time }
    EvaluationDecision:
      type: object
      properties:
        result: { $ref: '#/components/schemas/EvaluationResult' }
        conditions: { type: [string, 'null'] }
        reasons: { type: [string, 'null'] }
        decided_by: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        decided_at: { type: string, format: date-time }

    # ── Admin misc ──
    AdminDashboard:
      type: object
      properties:
        today:
          type: object
          properties:
            new_registrations: { type: integer }
            new_opportunities: { type: integer }
            new_interests: { type: integer }
            pending_memberships: { type: integer }
        pipeline:
          type: object
          description: Count per OpportunityStatus
          additionalProperties: { type: integer }
        overdue:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [review, completion, evaluation, owner_decision] }
              opportunity_uuid: { type: string, format: uuid }
              name: { type: string }
              due_at: { type: string, format: date-time }
              days_overdue: { type: integer }
        my_tasks:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              route: { type: string }
              due_at: { type: [string, 'null'], format: date-time }
    Report:
      type: object
      required: [key, computed_at, data]
      properties:
        key: { type: string }
        from: { type: [string, 'null'], format: date }
        to: { type: [string, 'null'], format: date }
        computed_at: { type: string, format: date-time }
        data:
          description: Shape depends on key (rows of label/value, or a matrix); never personal data for reports_viewer.
          oneOf:
            - type: array
              items: { type: object, additionalProperties: true }
            - type: object
              additionalProperties: true
    AuditLog:
      type: object
      required: [uuid, action, created_at]
      properties:
        uuid: { type: string, format: uuid }
        user: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string } } }
        action: { type: string, example: opportunity.transition }
        auditable_type: { type: string }
        auditable_id: { type: integer }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        ip: { type: string }
        user_agent: { type: string }
        request_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ContentItem:
      type: object
      required: [id, slug, title]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string, description: Localised }
        body: { type: string, description: Localised Markdown/HTML }
        title_ar: { type: string }
        title_en: { type: [string, 'null'] }
        body_ar: { type: string }
        body_en: { type: [string, 'null'] }
        version: { type: string, description: 'Legal pages: version string referenced by consents' }
        is_published: { type: boolean }
        published_at: { type: [string, 'null'], format: date-time }
        starts_at: { type: [string, 'null'], format: date-time, description: events }
        location: { type: [string, 'null'], description: events }
    ContentItemInput:
      type: object
      properties:
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        title_ar: { type: string }
        title_en: { type: string }
        body_ar: { type: string }
        body_en: { type: string }
        is_published: { type: boolean }
        published_at: { type: string, format: date-time }
        starts_at: { type: string, format: date-time }
        location: { type: string }
    ContactMessage:
      type: object
      properties:
        id: { type: integer }
        reference_no: { type: string }
        category: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        message: { type: string }
        assigned_to: { type: [integer, 'null'] }
        status: { type: string, enum: [new, in_progress, closed] }
        created_at: { type: string, format: date-time }

    # ── Payments ──
    Payment:
      type: object
      required: [uuid, purpose, amount, currency, status, gateway]
      properties:
        uuid: { type: string, format: uuid }
        purpose: { $ref: '#/components/schemas/PaymentPurpose' }
        amount: { type: number }
        currency: { type: string, const: SAR }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        gateway: { type: string, enum: [moyasar] }
        gateway_payment_id: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        invoice:
          type: [object, 'null']
          properties:
            number: { type: string }
            vat_rate: { type: number, example: 0.15 }
            vat_amount: { type: number }
            total: { type: number }
            issued_at: { type: string, format: date-time }
            pdf_document_uuid: { type: [string, 'null'], format: uuid }
        paid_at: { type: [string, 'null'], format: date-time }
        failed_reason: { type: [string, 'null'] }
        refunded_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    # ── System ──
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        db: { type: string, enum: [ok, fail] }
        redis: { type: string, enum: [ok, fail] }
        storage: { type: string, enum: [ok, fail] }
        queue_lag: { type: integer, description: seconds since oldest pending job }
        version: { type: string }
        checked_at: { type: string, format: date-time }
