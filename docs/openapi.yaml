  # ───────────────────────────── Payments ─────────────────────────────
  /payments/intents:
    post:
      tags: [Payments]
      operationId: createPaymentIntent
      summary: إنشاء نية دفع (المبلغ يحدده الخادم من الإعدادات)
      description: |
        Only `membership_fee | service_fee | training | sponsorship`. The platform never
        collects deal money (doc §16.1). Disabled unless `features.payments=true`.
      x-requirement: [SEC-01, AUD-01]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, idempotency_key]
              properties:
                purpose: { $ref: '#/components/schemas/PaymentPurpose' }
                amount: { type: number, description: Ignored for membership_fee (server-side) }
                idempotency_key: { type: string, format: uuid }
      responses:
        '201':
          description: Intent
          content:
            application/json:
              schema:
                type: object
                required: [payment_uuid, gateway, publishable_key, callback_url, amount, currency]
                properties:
                  payment_uuid: { type: string, format: uuid }
                  gateway: { type: string, enum: [moyasar] }
                  publishable_key: { type: string }
                  callback_url: { type: string, format: uri }
                  amount: { type: number }
                  currency: { type: string, const: SAR }
        '200':
          description: Same idempotency key → existing intent returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/FeatureDisabled' }
        '422': { $ref: '#/components/responses/ValidationError' }

